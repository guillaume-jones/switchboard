name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
      - name: Bump the version
        id: version
        run: |
          IFS=. read -r major minor patch < <(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          case ${{ inputs.bump }} in
            major) version=$((major + 1)).0.0 ;;
            minor) version=$major.$((minor + 1)).0 ;;
            patch) version=$major.$minor.$((patch + 1)) ;;
          esac
          sed -i '' "s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          cargo update --workspace
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Build the swb sidecar
        run: |
          mkdir -p app/src-tauri/binaries
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p switchboard-cli --target $target
            cp target/$target/release/swb app/src-tauri/binaries/swb-$target
          done
          lipo -create -output app/src-tauri/binaries/swb-universal-apple-darwin app/src-tauri/binaries/swb-*-apple-darwin
      - name: Build the app
        working-directory: app
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin --bundles dmg
          mv ../target/universal-apple-darwin/release/bundle/dmg/*.dmg "$RUNNER_TEMP/Switchboard.dmg"
        env:
          APPLE_SIGNING_IDENTITY: "-"
      - name: Push the version and release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG"
          git tag "$TAG"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "$TAG"
          gh release create "$TAG" "$RUNNER_TEMP/Switchboard.dmg" --title "Switchboard $TAG" --generate-notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
