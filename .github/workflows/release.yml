name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: bump
        run: |
          IFS=. read -r major minor patch < <(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          case ${{ inputs.bump }} in
            major) version=$((major + 1)).0.0 ;;
            minor) version=$major.$((minor + 1)).0 ;;
            patch) version=$major.$minor.$((patch + 1)) ;;
          esac
          sed -i "s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          cargo update --workspace
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: version
          path: |
            Cargo.toml
            Cargo.lock

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build the swb and swb-hold sidecars
        run: |
          mkdir -p app/src-tauri/binaries
          for target in ${{ runner.os == 'macOS' && 'aarch64-apple-darwin x86_64-apple-darwin' || matrix.target }}; do
            cargo build --release -p switchboard-cli -p switchboard-core --bin swb --bin swb-hold --target $target
            for bin in swb swb-hold; do
              cp target/$target/release/$bin app/src-tauri/binaries/$bin-$target
            done
          done
          if [ "$RUNNER_OS" = macOS ]; then
            for bin in swb swb-hold; do
              lipo -create -output app/src-tauri/binaries/$bin-universal-apple-darwin \
                app/src-tauri/binaries/$bin-aarch64-apple-darwin app/src-tauri/binaries/$bin-x86_64-apple-darwin
            done
          fi
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<< "$P12" > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -f pkcs12 -x -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
        env:
          # Tauri's APPLE_CERTIFICATE only accepts Apple-issued certificates, hence the manual import.
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      - name: Build the app
        working-directory: app
        run: |
          npm ci
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          shopt -s nullglob
          mkdir ../dist-release
          for file in ../target/${{ matrix.target }}/release/bundle/*/*.{dmg,deb,rpm}; do
            mv "$file" "../dist-release/Switchboard.${file##*.}"
          done
        env:
          APPLE_SIGNING_IDENTITY: Switchboard Release
      - name: Verify the signing certificate
        if: runner.os == 'macOS'
        run: >-
          codesign --verify --deep --strict --all-architectures
          -R '=certificate leaf = H"7E4C1DCE774B028726156D01E30FEB225D97D0F9"'
          target/${{ matrix.target }}/release/bundle/macos/Switchboard.app
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: dist-release/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: version
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: dist-release
          merge-multiple: true
      - name: Push the version and release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git tag "v$VERSION"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"
          gh release create "v$VERSION" dist-release/* --title "$VERSION" --generate-notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
