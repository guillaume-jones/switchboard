[workspace]
resolver = "3"
members = ["core", "cli", "app/src-tauri"]
default-members = ["core", "cli"]

[workspace.package]
edition = "2024"
version = "0.3.0"

[workspace.dependencies]
anyhow = "1"
switchboard-core = { path = "core" }
oxc = { version = "=0.158.0", default-features = false, features = ["codegen", "semantic", "transformer"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
